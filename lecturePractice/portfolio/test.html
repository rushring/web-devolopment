<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Login Page</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #e8eefc, #f7f9ff);
		}

		.login-card {
			width: min(100%, 360px);
			padding: 32px;
			border-radius: 16px;
			background: #ffffff;
			box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
		}

		h1 {
			margin: 0 0 8px;
			font-size: 28px;
			text-align: center;
		}

		p {
			margin: 0 0 24px;
			color: #666;
			text-align: center;
			font-size: 14px;
		}

		label {
			display: block;
			margin-bottom: 8px;
			font-size: 14px;
			font-weight: 600;
		}

		input {
			width: 100%;
			padding: 12px 14px;
			margin-bottom: 16px;
			border: 1px solid #cfd6e4;
			border-radius: 10px;
			font-size: 14px;
		}

		button {
			width: 100%;
			padding: 12px 14px;
			border: 0;
			border-radius: 10px;
			background: #2f5bea;
			color: #fff;
			font-size: 15px;
			font-weight: 600;
			cursor: pointer;
		}

		.help-text {
			margin-top: 14px;
			text-align: center;
			font-size: 13px;
		}

		.help-text a {
			color: #2f5bea;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<main class="login-card">
		<h1>Login</h1>
		<p>Enter your credentials to access your account.</p>

		<form>
			<label for="email">Email</label>
			<input type="email" id="email" name="email" placeholder="you@example.com" required>

			<label for="password">Password</label>
			<input type="password" id="password" name="password" placeholder="Enter your password" required>

			<button type="submit">Sign In</button>
		</form>

		<div class="help-text">
			<a href="#">Forgot password?</a>
		</div>
	</main>
</body>
</html>
